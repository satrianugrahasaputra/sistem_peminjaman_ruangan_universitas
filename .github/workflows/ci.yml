name: CI Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "super-secret-jwt-key-universitas-sarpras-2026"
      ROOM_API_URL: "https://api-ruangan.vercel.app/rooms"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database & Seed Fixtures
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Run Vitest Automated Test Suite
        run: npm test
